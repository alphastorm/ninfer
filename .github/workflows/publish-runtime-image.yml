name: Publish NInfer runtime image
run-name: Publish NInfer runtime image / ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact NInfer source commit bound by the release binaries
        required: true
        type: string
      release_tag:
        description: Existing GitHub prerelease containing the binary archive
        required: true
        type: string
      binary_asset:
        description: Exact binary archive asset name
        required: true
        type: string
      binary_sha256:
        description: Expected binary archive SHA-256
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: ninfer-runtime-image-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify binary release and publish runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BINARY_ASSET: ${{ inputs.binary_asset }}
      BINARY_SHA256: ${{ inputs.binary_sha256 }}
      IMAGE_REPOSITORY: ghcr.io/alphastorm/ninfer-runtime
      BASE_IMAGE: ghcr.io/alphastorm/ninfer@sha256:a19e00c5d7993d7c12341974bdc7e3d13e61d9deaf39e8ce00cf94abd6137712
      BASE_IMAGE_DIGEST: sha256:a19e00c5d7993d7c12341974bdc7e3d13e61d9deaf39e8ce00cf94abd6137712
    steps:
      - name: Check out complete public source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up isolated Docker Buildx builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate immutable publication inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "alphastorm/ninfer" ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-qwen38-5090-beta\.([1-9][0-9]*)$ ]]
          release_version="${BASH_REMATCH[1]}"
          beta_number="${BASH_REMATCH[2]}"
          [[ "$BINARY_ASSET" =~ ^ninfer-qwen38-rtx5090-v([0-9]+\.[0-9]+\.[0-9]+)-linux-x86_64-cuda13\.1\.tar\.gz$ ]]
          [[ "${BASH_REMATCH[1]}" == "$release_version" ]]
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$tag_commit" == "$SOURCE_COMMIT" ]]
          [[ "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" == "$RELEASE_TAG" ]]
          [[ "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" == "true" ]]
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == "false" ]]
          runtime_release_tag="v$release_version-qwen38-5090-runtime-beta.$beta_number"
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
          printf 'RUNTIME_RELEASE_TAG=%s\n' "$runtime_release_tag" >> "$GITHUB_ENV"

      - name: Download and verify binary release
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ninfer-runtime"
          mkdir -p "$root/download" "$root/context"
          gh release download "$RELEASE_TAG" --pattern "$BINARY_ASSET" --dir "$root/download"
          archive="$root/download/$BINARY_ASSET"
          printf '%s  %s\n' "$BINARY_SHA256" "$archive" | sha256sum -c -
          expected_root="${BINARY_ASSET%.tar.gz}"
          payload="$root/context/$expected_root"
          ARCHIVE="$archive" CONTEXT="$root/context" EXPECTED_ROOT="$expected_root" python3 <<'PY'
          import os
          import pathlib
          import tarfile

          archive = os.environ["ARCHIVE"]
          context = pathlib.Path(os.environ["CONTEXT"]).resolve()
          expected_root = os.environ["EXPECTED_ROOT"]
          expected = {
              expected_root,
              f"{expected_root}/bin",
              f"{expected_root}/LICENSE",
              f"{expected_root}/bin/ninfer",
              f"{expected_root}/bin/ninfer-serve",
              f"{expected_root}/build-identity.json",
          }
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              names = {member.name.rstrip("/") for member in members}
              if names != expected or len(members) != len(expected):
                  raise SystemExit("binary archive has an unexpected member inventory")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or path.parts[0] != expected_root:
                      raise SystemExit(f"unsafe archive member: {member.name}")
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f"unsupported archive member type: {member.name}")
              bundle.extractall(context, filter="data")
          payload = (context / expected_root).resolve()
          if context not in payload.parents:
              raise SystemExit("extracted payload escaped the build context")
          PY
          test -x "$payload/bin/ninfer"
          test -x "$payload/bin/ninfer-serve"
          test -f "$payload/build-identity.json"
          [[ "$(jq -r .schema_version "$payload/build-identity.json")" == "1" ]]
          [[ "$(jq -r .artifact_type "$payload/build-identity.json")" == "ninfer_release_build_identity" ]]
          [[ "$(jq -r .patch_stack_sha "$payload/build-identity.json")" == "$SOURCE_COMMIT" ]]
          [[ "$(jq -r .source_dirty "$payload/build-identity.json")" == "false" ]]
          [[ "$(jq -r .release_version "$payload/build-identity.json")" == "v$RELEASE_VERSION" ]]
          for executable in ninfer ninfer-serve; do
            expected="$(jq -er --arg executable "$executable" '.binaries[$executable] | select(test("^[0-9a-f]{64}$"))' "$payload/build-identity.json")"
            actual="$(sha256sum "$payload/bin/$executable" | cut -d' ' -f1)"
            [[ "$actual" == "$expected" ]]
          done
          printf 'PAYLOAD=%s\n' "$payload" >> "$GITHUB_ENV"
          printf 'RUNTIME_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Build and push untagged digest
        shell: bash
        run: |
          set -euo pipefail
          cp "$PAYLOAD/bin/ninfer" "$RUNTIME_ROOT/context/ninfer"
          cp "$PAYLOAD/bin/ninfer-serve" "$RUNTIME_ROOT/context/ninfer-serve"
          cat > "$RUNTIME_ROOT/context/Dockerfile" <<EOF
          FROM $BASE_IMAGE
          COPY --chmod=0755 ninfer /usr/local/bin/ninfer
          COPY --chmod=0755 ninfer-serve /usr/local/bin/ninfer-serve
          WORKDIR /workspace
          EXPOSE 8080
          STOPSIGNAL SIGTERM
          CMD ["ninfer-serve", "--help"]
          EOF
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/alphastorm/ninfer" \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --label "org.opencontainers.image.base.digest=$BASE_IMAGE_DIGEST" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "$RUNTIME_ROOT/build-metadata.json" \
            --output "type=image,name=$IMAGE_REPOSITORY,push-by-digest=true,name-canonical=true,push=true" \
            "$RUNTIME_ROOT/context"
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNTIME_ROOT/build-metadata.json")"
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$digest" >/dev/null
          printf 'IMAGE_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"

      - name: Create secret-free digest receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNTIME_ROOT/ninfer-runtime-image-$RELEASE_TAG.json"
          jq -n \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg release_tag "$RELEASE_TAG" \
            --arg runtime_release_tag "$RUNTIME_RELEASE_TAG" \
            --arg binary_asset "$BINARY_ASSET" \
            --arg binary_sha256 "$BINARY_SHA256" \
            --arg base_image "$BASE_IMAGE" \
            --arg base_image_digest "$BASE_IMAGE_DIGEST" \
            --arg image_reference "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg workflow_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              artifact_type: "ninfer_runtime_image_publication_receipt",
              schema_version: 3,
              source_commit: $source_commit,
              release_tag: $release_tag,
              runtime_release_tag: $runtime_release_tag,
              binary_asset: $binary_asset,
              binary_sha256: $binary_sha256,
              base_image: $base_image,
              base_image_digest: $base_image_digest,
              image_reference: $image_reference,
              image_digest: $image_digest,
              workflow_url: $workflow_url,
              secret_free: true
            }' > "$receipt"

      - name: Upload publication receipt
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ninfer-runtime-image-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/ninfer-runtime/ninfer-runtime-image-${{ inputs.release_tag }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable runtime attestation prerelease
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNTIME_ROOT/ninfer-runtime-image-$RELEASE_TAG.json"
          gh release create "$RUNTIME_RELEASE_TAG" "$receipt" \
            --target "$SOURCE_COMMIT" \
            --draft \
            --prerelease \
            --title "NInfer $RELEASE_VERSION Qwen3.8 RTX 5090 runtime beta" \
            --notes "Digest-addressed linux/amd64 CUDA 13.1 runtime image built from $RELEASE_TAG. No mutable consumer tag is published; use image_reference from the receipt."
          release_json="$(gh release view "$RUNTIME_RELEASE_TAG" --json isDraft,isPrerelease,targetCommitish,assets)"
          [[ "$(jq -r .isDraft <<<"$release_json")" == "true" ]]
          [[ "$(jq -r .isPrerelease <<<"$release_json")" == "true" ]]
          [[ "$(jq -r .targetCommitish <<<"$release_json")" == "$SOURCE_COMMIT" ]]
          receipt_sha256="$(sha256sum "$receipt" | cut -d' ' -f1)"
          asset_digest="$(jq -er --arg name "$(basename "$receipt")" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
          [[ "$asset_digest" == "sha256:$receipt_sha256" ]]
          {
            echo '## NInfer runtime image'
            echo
            echo "- Source: \`$SOURCE_COMMIT\`"
            echo "- Image: \`$IMAGE_REPOSITORY@$IMAGE_DIGEST\`"
            echo "- Binary release: \`$RELEASE_TAG\`"
            echo "- Runtime release: \`$RUNTIME_RELEASE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release edit "$RUNTIME_RELEASE_TAG" --draft=false --prerelease
