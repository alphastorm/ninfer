name: RDC build determinism

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rdc-determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  double-build:
    name: CUDA 13.1 bounded RDC double build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install CUDA 13.1 and host dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cuda-keyring.deb" \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cuda-toolkit-13-1 \
            cmake ninja-build binutils pkg-config libhwloc-dev liburing-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libjpeg-dev libcurl4-openssl-dev \
            python3-jinja2 python3-jsonschema
          echo /usr/local/cuda-13.1/bin >> "$GITHUB_PATH"
      - name: Compare two clean bounded builds without executing CUDA
        run: |
          python3 -B tests/test_cuda_determinism.py
          python3 -B tools/release/check-rdc-determinism.py --work "$RUNNER_TEMP/rdc-double-build"
      - name: Retain byte, section and symbol attribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rdc-determinism
          path: ${{ runner.temp }}/rdc-double-build/evidence
          if-no-files-found: error
